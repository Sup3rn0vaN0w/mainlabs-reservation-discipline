# H3 ADVERSARIAL SWEEP (spec Section 7): runaway injection 0/1/5/10 percent of
# agentic arrivals, one representative mix. Feeds the H3 compliant-completion deltas
# in the H1 readout (papers only, not filing). Horizon 1500s so agentic
# flows (median lifetime ~863s) can complete -- see docs/H3_ZERO_CHECK.md.
# House style: hyphens only (D-026).
policies: [fcfs, vllm_style, niyama_style, concur_style, fastserve_mlfq, mars_style, reservation]
seeds: [1, 2, 3]
tuned_params: configs/tuned_params.json
cell:
  horizon_s: 1500.0
  warmup_s: 150.0
  tick_s: 0.5
  slots: 16
  hbm_gib: 80.0
  capacity_per_device: 8.0
axes:
  mix: [0.50]                            # representative agentic-heavy mix
  load: [1.2]
  num_devices: [4]
  gap_median_s: [20]
  runaway_fraction: [0.0, 0.01, 0.05, 0.10]
