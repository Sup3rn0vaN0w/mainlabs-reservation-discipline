# MAIN GRID (spec Section 7). Authorized at SG7, NOT run at SG6.
# House style: hyphens only (D-026).
#
# This file exists at SG6 so the pilot can project the full-grid wall time against
# the 24-hour runtime guard (brief Section 8). The pilot does not run it.
#
# Cells (excluding policy and seed) = |mix| x |load| x |num_devices| x |gap| =
# 3 x 4 x 3 x 3 = 108. With 7 policies (mars_style added, Amendment 1) and 3 seeds
# that is 2,268 runs.
#
# Corner cells (spec Section 5, excluded from support): gap median > 15 min with
# strict pin; agentic share > 70 percent; offered load < 0.6x. This grid stays
# inside the operating region on every axis (gap <= 5 min, mix <= 0.5, load >= 0.7),
# so the analysis applies no exclusions here -- they are enforced in code regardless.

# HORIZON 1500s (was 300s): agentic flow lifetime median ~863s, so 300s
# suppressed agentic completions and biased H1 against the reservation discipline
# (docs/H3_ZERO_CHECK.md). Ratified as Amendment 2.
#
# AMENDMENT 3 (2026-07-20): num_devices drops 64; seeds drop 5 -> 3. Measured on
# cloud hardware at the 1500s horizon, ONE 64-device run takes 24-32h -- and a run is
# single-threaded, so the 24h guard could not be met at ANY budget on ANY number of
# machines. See content/research/plane_separation/SG7_GRID_FEASIBILITY_2026-07-20.md.
# Everything else is UNCHANGED: 1500s horizon, load axis incl. 1.3 and 1.5, full gap
# axis, all 7 policies, spec Section 3 thresholds.
# COST OF THIS AMENDMENT: 3 seeds widen the bootstrap CIs versus 5, and the
# cluster-size generality claim no longer extends to 64 devices. This is a ratified
# trade of statistical power for feasibility, not a runtime convenience.
policies: [fcfs, vllm_style, niyama_style, concur_style, fastserve_mlfq, mars_style, reservation]
seeds: [1, 2, 3]
tuned_params: configs/tuned_params.json

cell:
  horizon_s: 1500.0
  warmup_s: 150.0
  tick_s: 0.5
  slots: 16
  hbm_gib: 80.0
  capacity_per_device: 8.0

axes:
  mix: [0.10, 0.30, 0.50]
  load: [0.7, 1.0, 1.3, 1.5]
  num_devices: [8, 16, 32]
  gap_median_s: [20, 60, 300]
